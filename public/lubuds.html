<style>
  :root {
    --bg: #141210;
    --gold: #C9A15C;
    --gold-soft: #E3C88F;
    --gold-dim: #8f7548;
    --line: rgba(201, 161, 92, .22);
    --line-strong: rgba(201, 161, 92, .38);
    --text: #EDE7DC;
    --muted: #A79E90;
    --faint: #7C7466;
    --serif: 'Cormorant Garamond', 'Songti SC', 'Noto Serif TC', 'STSong', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'PingFang HK', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    line-height: 1.6; overflow-x: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(52vw 34vh at 50% -6%, rgba(201, 161, 92, .16), transparent 70%),
      radial-gradient(40vw 28vh at 88% 30%, rgba(201, 161, 92, .05), transparent 72%),
      radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, .5) 100%);
  }
  .wrap { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 0 22px 64px; }

  /* header */
  .top { display: flex; align-items: center; gap: 13px; padding: 20px 0 6px; }
  .top img { height: 26px; width: auto; display: block; }
  .vline { width: 1px; height: 22px; background: var(--line-strong); }
  .lubuds { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: .11em; color: #F4EFE6; line-height: 1; }
  .lubuds sup { font-size: 8px; letter-spacing: 0; vertical-align: super; color: var(--muted); }
  /* Cormorant defaults to oldstyle figures: "10" reads as "IO". Force lining on every serif number. */
  .hero h1, .stat b, .codeval, .steps li b, .sec-title, footer a { font-feature-settings: 'lnum' 1; }
  .langs { margin-left: auto; display: flex; gap: 6px; }
  .lang {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 99px; padding: 6px 11px; font-size: 11.5px; letter-spacing: .04em;
    cursor: pointer; font-family: var(--sans); transition: border-color .25s ease, color .25s ease, background .25s ease;
  }
  .lang.active { border-color: var(--gold-dim); color: var(--gold-soft); background: rgba(201, 161, 92, .09); }
  /* narrower than ~380px the header needs the language pills to still fit */
  @media (max-width: 380px) {
    .top { gap: 9px; }
    .top img { height: 21px; }
    .lubuds { font-size: 18px; letter-spacing: .06em; }
    .langs { gap: 4px; }
    .lang { padding: 5px 9px; font-size: 11px; }
  }

  /* hero */
  .hero { text-align: center; padding: 46px 0 0; }
  .kicker { font-size: 12px; font-weight: 500; letter-spacing: .34em; text-transform: uppercase; color: var(--gold-dim); }
  .hero h1 {
    font-family: var(--serif); font-weight: 600; line-height: 1.02; letter-spacing: .01em;
    font-size: clamp(44px, 15vw, 76px); color: #F6F1E8; margin-top: 18px;
  }
  .hero h1 .num { color: var(--gold-soft); font-size: 1.28em; }
  html[lang="en"] .hero h1 { font-size: clamp(38px, 11vw, 58px); letter-spacing: 0; }
  .hairline { width: 64px; height: 1px; background: var(--line-strong); margin: 24px auto; }
  .lead { font-size: 14.5px; color: var(--muted); letter-spacing: .02em; }
  .stats { display: flex; justify-content: center; margin-top: 30px; }
  .stat { padding: 0 20px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-family: var(--serif); font-weight: 600; font-size: 27px; color: var(--gold-soft); line-height: 1.1; }
  .stat span { font-size: 11.5px; color: var(--faint); letter-spacing: .06em; }
  .btn-claim {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px 34px; border-radius: 99px; border: none;
    background: linear-gradient(180deg, #D9B678, #C9A15C); color: #14120E;
    font-family: var(--sans); font-size: 14.5px; font-weight: 600; letter-spacing: .06em;
    cursor: pointer; transition: transform .2s ease, filter .25s ease;
  }
  .btn-claim:active { transform: scale(.97); }
  .btn-claim:hover { filter: brightness(1.06); }

  /* paragraph */
  .para { margin-top: 40px; padding: 24px 0 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.9; color: var(--muted); }
  .para strong { color: var(--text); font-weight: 600; }

  /* claim zone: tapping the button retires it and the code takes its place */
  .claimzone { margin-top: 32px; }
  .codereveal { display: none; }
  .codereveal .cc-label { font-size: 12px; letter-spacing: .22em; color: var(--gold-dim); text-transform: uppercase; }
  .coderow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 14px; margin: 16px 0 8px; }
  .codeval {
    font-family: var(--serif); font-weight: 600; color: var(--gold-soft);
    font-size: clamp(27px, 8.2vw, 44px); letter-spacing: .1em; line-height: 1; margin: 0;
    padding-left: .1em;
  }
  .cc-hint { font-size: 12px; color: var(--faint); letter-spacing: .04em; }
  .btn-copy {
    padding: 13px 22px; border-radius: 99px;
    border: 1px solid var(--gold-dim); background: rgba(201, 161, 92, .1); color: var(--gold-soft);
    font-family: var(--sans); font-size: 14px; font-weight: 600; letter-spacing: .08em; white-space: nowrap;
    cursor: pointer; transition: background .3s ease, color .3s ease, border-color .3s ease;
  }
  .btn-copy.done { background: var(--gold); border-color: var(--gold); color: #14120E; }
  .claimzone.on .btn-claim { display: none; }
  /* the fade comes from the keyframes only, so a reduced-motion visitor still sees the code */
  .claimzone.on .codereveal { display: block; animation: revealIn .7s cubic-bezier(.22, .61, .36, 1) both; }
  @keyframes revealIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* sections */
  section { margin-top: 52px; }
  .sec-kick { font-size: 11.5px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-dim); }
  .sec-title { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 24px; color: var(--gold); margin-top: 12px; line-height: 1.3; }

  /* steps */
  .steps ol { list-style: none; display: grid; gap: 15px; margin-top: 22px; }
  .steps li { display: flex; gap: 14px; align-items: flex-start; font-size: 14px; line-height: 1.65; }
  .steps li b { font-family: var(--serif); font-weight: 600; font-size: 20px; color: var(--gold); min-width: 24px; line-height: 1.35; }
  @media (min-width: 660px) { .steps ol { grid-template-columns: 1fr 1fr; gap: 15px 30px; } }

  /* download */
  .dl-row { display: flex; justify-content: center; gap: 34px; margin-top: 26px; }
  .dl-item { display: flex; flex-direction: column; align-items: center; gap: 11px; text-decoration: none; color: inherit; cursor: pointer; }
  .dl-item .panel svg { width: 108px; height: auto; display: block; }
  .dl-item span { font-size: 11.5px; letter-spacing: .1em; color: var(--muted); }
  .dl-item i { font-style: normal; font-size: 10.5px; color: var(--faint); letter-spacing: .04em; }

  /* terms */
  .terms { margin-top: 56px; border-top: 1px solid var(--line); padding-top: 24px; }
  .terms h3 { font-size: 12px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-dim); }
  .terms ul { list-style: none; margin-top: 14px; }
  .terms li { position: relative; padding-left: 15px; font-size: 11.5px; line-height: 1.85; color: var(--faint); margin-top: 7px; }
  .terms li::before { content: ''; position: absolute; left: 0; top: .78em; width: 4px; height: 4px; background: var(--gold-dim); opacity: .7; }

  /* footer */
  footer { margin-top: 48px; text-align: center; }
  footer a { font-family: var(--serif); font-size: 15px; letter-spacing: .34em; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .foot-note { margin-top: 18px; font-size: 11px; color: var(--faint); letter-spacing: .05em; }

  /* motion */
  .rise { opacity: 0; transform: translateY(16px); animation: rise .85s cubic-bezier(.22, .61, .36, 1) both; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .d1 { animation-delay: .06s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .27s; }
  .d4 { animation-delay: .38s; } .d5 { animation-delay: .5s; } .d6 { animation-delay: .62s; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .rise { opacity: 1; transform: none; } }
  /* ICP 备案页脚：底部中央，备案号链接备案管理系统（《非经营性互联网信息服务备案管理办法》第十三条）。字体/字距显式覆盖上面的 footer a（.34em 字距 + serif 是给 LUBUDS.COM 那个拉丁标题用的）。 */
  footer .icp-line { margin: 18px 0 0; font-family: var(--sans); font-size: 12px; letter-spacing: 0; color: var(--faint); }
  footer .icp-line a { font-family: var(--sans); font-size: 12px; letter-spacing: 0; color: var(--faint); text-decoration: underline; border-bottom: 0; padding-bottom: 0; margin-left: 8px; }
</style>

var CODE = 'LUDLH2025';

/* Tapping Claim retires the button and the code takes its place. */
function reveal() {
  ZONE.classList.add('on');
}

function applyLang(l) {
  var d = I18N[l] || I18N.en;
  document.documentElement.lang = l === 'hant' ? 'zh-Hant' : (l === 'hans' ? 'zh-Hans' : 'en');
  document.title = d.title;
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var k = el.getAttribute('data-i18n'); if (d[k] != null) el.textContent = d[k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
    var k = el.getAttribute('data-i18n-html'); if (d[k] != null) el.innerHTML = d[k];
  });
  document.querySelectorAll('.lang').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-lang') === l);
  });
  try { localStorage.setItem('dl_lubuds_lang', l); } catch (e) {}
}

(function initLang() {
  var l = null;
  try { l = localStorage.getItem('dl_lubuds_lang'); } catch (e) {}
  if (!l) {
    var n = (navigator.language || 'en').toLowerCase();
    l = /zh-(tw|hk|mo|hant)/.test(n) ? 'hant' : (/^zh/.test(n) ? 'hans' : 'en');
  }
  applyLang(l);
})();

document.querySelectorAll('.lang').forEach(function (b) {
  b.addEventListener('click', function () { applyLang(b.getAttribute('data-lang')); });
});

document.getElementById('claim').addEventListener('click', reveal);

document.getElementById('copy').addEventListener('click', function () {
  var btn = this;
  var lang = document.documentElement.lang === 'zh-Hant' ? 'hant' : (document.documentElement.lang === 'zh-Hans' ? 'hans' : 'en');
  var d = I18N[lang];
  function done(ok) {
    if (ok) {
      btn.classList.add('done');
      btn.textContent = d.copied;
    }
    if (!ok) {
      /* No clipboard access: select the code and tell them to long-press it.
         The instruction goes on the full-width hint line so the button keeps its size. */
      if (HINT) HINT.textContent = d.copyFail;
      var r = document.createRange(); r.selectNodeContents(document.getElementById('codeval'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    setTimeout(function () {
      btn.classList.remove('done'); btn.textContent = d.copyBtn;
      if (HINT) HINT.textContent = d.codeHint;
    }, 2600);
  }

    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = CODE; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';

      ok = document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) { ok = false; }
    done(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(CODE).then(function () { done(true); }, legacy);
  } else { legacy(); }
